<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartAgro Environmental Monitoring</title>
<style>
:root{--navy:#18324b;--green:#27877b;--blue:#3977a8;--amber:#d89b2b;--red:#b65252;--bg:#eef3f5;--ink:#202c36}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",sans-serif}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:var(--navy);color:white;padding:24px}.brand{font-size:22px;font-weight800}.side small{display:block;opacity:.75;margin-top:6px}.nav{margin-top:32px}.nav div{padding:11px 12px;border-radius:8px;margin:5px 0}.nav .active{background:#244961}.main{padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.badge{background:#fff;border:1px solid #b9c8d1;color:#305168;padding:8px 12px;border-radius:18px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:14px;margin:20px 0}.card,.panel{background:white;border-radius:14px;box-shadow:0 5px 18px #18324b12}.card{padding:16px}.card label{font-size:12px;color:#687887}.card strong{display:block;font-size:26px;margin-top:8px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}.panel{padding:16px}.panel h3{margin:0 0 12px;color:var(--navy)}canvas{width:100%;height:260px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls button,.controls select{border:0;border-radius8px;padding:9px 12px}.controls button{background:var(--green);color:white;cursor:pointer}.controls select{background:white;border:1px solid #cbd5dc}.stress{border-left:5px solid var(--green);padding:12px;margin-bottom:10px}.stress.high{border-color:var(--red)}.stress.moderate{border-color:var(--amber)}.stress.normal{border-color:var(--green)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding8px;border-bottom:1px solid #e6ecef}.alert{padding:10px;border-radius8px;background:#fff7e6;margin:8px 0;font-size:12px}.meta{font-size12px;color:#687887;line-height:1.7}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="shell">
<aside class="side"><div class="brand">SmartAgro</div><small>Environmental Monitoring</small><div class="nav"><div class="active">Overview</div><div>Sensor Trends</div><div>Stress Analysis</div><div>Alerts</div></div></aside>
<main class="main"><div class="top"><div><h1 style="margin0;color:var(--navy)">Environmental Monitoring</h1><div id="timestamp" class="meta"></div></div><div class="badge">Recorded Dataset – Simulated Monitoring</div></div>
<div class="controls" style="margin-top16px"><button id="start">Start</button><button id="pause">Pause</button><button id="reset">Reset</button><select id="dataset"><option value="smartagro_iot">SmartAgro IoT archive</option><option value="predictive_irrigation">Predictive irrigation time series</option><option value="motor_monitor">Motor-monitor archive</option></select><label>Speed <select id="speed"><option value="2000">Slow</option><option value="800" selected>Normal</option><option value="250">Fast</option></select></label></div>
<div class="cards"><div class="card"><label>Temperature</label><strong id="temperature">—</strong></div><div class="card"><label>Humidity</label><strong id="humidity">—</strong></div><div class="card"><label>Soil moisture</label><strong id="moisture">—</strong></div><div class="card"><label>Soil / light</label><strong id="extra">—</strong></div></div>
<div class="grid"><div class="panel"><h3>Historical sensor trend</h3><canvas id="chart"></canvas></div><div><div class="panel"><h3>Environmental stress</h3><div id="stress" class="stress normal">Waiting for data</div></div><div class="panel" style="margin-top14px"><h3>Active alerts</h3><div id="alerts">No alerts</div></div></div></div>
<div class="grid" style="margin-top14px"><div class="panel"><h3>Dataset information</h3><div id="meta" class="meta"></div></div><div class="panel"><h3>Historical alert log</h3><div id="history"></div></div></div>
</main></div>
<script>
let timer=null,index=-1,dataset=document.getElementById('dataset').value;const trend=[];
function f(n,d=1){return n==null?'—':Number(n).toFixed(d)}
async function fetchReading(){const ds=document.getElementById('dataset').value;const r=await fetch(`/api/monitor?dataset=${ds}&index=${index<0?'':index}`).then(r=>r.json());index=r.index;dataset=ds;document.getElementById('timestamp').textContent=r.reading.timestamp||'Timestamp unavailable';document.getElementById('temperature').textContent=(f(r.reading.temperature_c,1)+' °C');document.getElementById('humidity').textContent=(f(r.reading.humidity_pct,1)+' %');document.getElementById('moisture').textContent=(f(r.reading.soil_moisture_pct,1)+(ds==='motor_monitor'?' raw':' %'));document.getElementById('extra').textContent=r.reading.soil_temperature_c!=null?'Soil '+f(r.reading.soil_temperature_c,1)+' °C':(r.reading.light_lux!=null?f(r.reading.light_lux,0)+' lux':'No extra sensor');
const s=document.getElementById('stress');s.className='stress '+r.stress.severity;s.innerHTML='<strong>'+r.stress.category+'</strong><br>'+ (r.stress.alerts[0]?.reason||'No abnormal condition detected by the configured rules.');
const al=document.getElementById('alerts');al.innerHTML=r.stress.alerts.length?r.stress.alerts.map(a=>'<div class="alert"><strong>'+a.type+'</strong><br>'+a.reason+'<br><em>'+a.action+'</em></div>').join(''):'<div class="alert">No active environmental warning.</div>';
document.getElementById('meta').innerHTML='<strong>'+r.dataset_name+'</strong><br>Source: '+r.source_url+'<br>License: '+r.license+'<br>Record '+(index+1)+' of '+r.total+'<br><em>'+r.playback_label+'</em>';
trend.push({t:r.reading.timestamp,temp:r.reading.temperature_c,moist:r.reading.soil_moisture_pct});if(trend.length>60)trend.shift();drawChart();}
function drawChart(){const c=document.getElementById('chart'),ctx=c.getContext('2d'),w=c.width=c.clientWidth*2,h=c.height=c.clientHeight*2;ctx.clearRect(0,0,w,h);if(trend.length<2)return;const vals=trend.map(x=>Number(x.temp)).filter(Number.isFinite);if(!vals.length)return;const mn=Math.min(...vals),mx=Math.max(...vals),span=(mx-mn)||1;ctx.strokeStyle='#3977a8';ctx.lineWidth=4;ctx.beginPath();trend.forEach((p,i)=>{const x=i/(trend.length-1)*(w-40)+20,y=h-20-(Number(p.temp)-mn)/span*(h-40);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();}
function start(){if(timer)return;timer=setInterval(()=>{index++;fetchReading()},Number(document.getElementById('speed').value))}function stop(){clearInterval(timer);timer=null}
document.getElementById('start').onclick=()=>start();document.getElementById('pause').onclick=()=>stop();document.getElementById('reset').onclick=()=>{stop();index=-1;trend.length=0;fetchReading()};document.getElementById('dataset').onchange=()=>{stop();index=-1;trend.length=0;fetchReading()};document.getElementById('speed').onchange=()=>{if(timer){stop();start()}};
fetchReading();
</script></body></html>
